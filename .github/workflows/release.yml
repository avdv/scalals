name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to trigger the JitPack build for
        required: true
        type: string
jobs:
  release:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trigger build on jitpack
        uses: ./.github/actions/trigger-jitpack
        with:
          version: ${{ github.event.release.tag_name || inputs.tag }}
