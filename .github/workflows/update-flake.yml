name: Update flake ❄

on:
  workflow_dispatch:
  schedule:
    # every wednesday at 3pm UTC
    - cron: '0 15 * * wed'

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: cbley
        extraPullNames: pre-commit-hooks
    - name: Set author identity
      run: |
        git config user.email '${{ github.actor }}@users.noreply.github.com'
        git config user.name '${{ github.actor }}'
    - run: nix flake update --commit-lock-file
    - name: Create Pull Request
      id: create-pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        commit-message: "[automation] flake update"
        title: "[automation] flake update"
        branch: "automation/update-flake-inputs"
        labels: "dependencies"
        token: "${{ secrets.PR_TOKEN }}"
    - name: Enable Pull Request Automerge
      run: gh pr merge --rebase --auto "${{ steps.create-pr.outputs.pull-request-number }}"
      env:
        GH_TOKEN: ${{ secrets.PR_TOKEN }}
